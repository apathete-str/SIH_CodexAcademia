services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes: ["./data:/app/data"]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

services:
  - type: web
    name: sih-codex-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: https://sih-codex-frontend.onrender.com

  - type: web
    name: sih-codex-frontend
    runtime: docker
    rootDir: frontend
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://sih-codex-api.onrender.com
      - key: API_PROXY_URL
        value: https://sih-codex-api.onrender.com